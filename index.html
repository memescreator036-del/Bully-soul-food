<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bully's Soul Food — Jackson, MS</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<div id="banner"></div>
<header class="top"><img id="lg" src="logo.jpg" alt="Bully's logo"><b>Bully's Soul Food</b><a class="l" href="#news-s" id="nl" hidden>News</a><a class="l" href="#menu-s">Menu</a><a class="l" href="#lb-s" id="ll" hidden>Leaderboard</a><a class="l" href="#visit">Visit</a><button class="btn" onclick="openCart()" id="hc">Order</button></header>
<section class="hero">
<div>
<h1>Real food.<br>Real love.</h1>
<p id="tg"></p>
<div class="chips"><span class="chip">2016 James Beard Award Winner</span><span class="chip">As seen on Travel Channel and Food Network</span></div>
<div class="cta"><a class="btn" href="#menu-s">See the menu</a><a class="ln tl" href="tel:">Call us</a></div>
</div>
<img id="hi" src="hero.jpg" alt="Bully Soul Food sign in the dining room">
</section>
<main class="wrap">
<div id="news"></div>
<section class="sec" id="menu-s"><h2>Menu</h2>
<div class="tb"><input id="sq" type="search" placeholder="Search the menu" aria-label="Search the menu" oninput="q=this.value.toLowerCase();grid()"><div class="pills" id="pills"></div></div>
<div id="grid"></div></section>
<div id="lb"></div>
<section class="sec" id="visit"><h2>Visit</h2>
<div class="vis"><div class="glass"><h4>Find us</h4><p id="ad"></p><p><a class="tl" href="tel:" id="ph"></a></p><p><a id="mp" target="_blank" rel="noopener">Open in maps</a></p></div><div class="glass"><h4>Hours</h4><p id="hrs"></p></div></div></section>
</main>
<footer><p>Bread and dipped-in-gravy cost extra. Sides change daily.</p><p>&copy; Bully's Soul Food <button id="badge" aria-label="Bully's crown badge"><svg width="22" height="16" viewBox="0 0 22 16"><path d="M1 14L3 3l5 5 3-7 3 7 5-5 2 11z" fill="#f0c24b"/></svg></button></p></footer>
<button id="fp" class="btn" onclick="openCart()"><span id="bc"></span><span id="bt"></span></button>
<div id="sc" onclick="closeCart()"></div><aside id="dr" aria-label="Your order"></aside>
<div id="m" onclick="if(event.target===this)hide()"><div class="box" id="mb"></div></div>
<div id="adm"><div class="ad"><div class="side" id="as"></div><div id="ab"></div></div></div>
<script id="seed" type="application/json">null</script>
<script src="app.js"></script></body></html>
