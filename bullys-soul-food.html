h1,h2,h3,h4{font-family:'Playfair Display',Georgia,serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:20px}
.btn{display:inline-block;background:linear-gradient(180deg,#f8d878,#c8921a);color:#1a1200;border:0;border-radius:999px;padding:11px 24px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.35;cursor:not-allowed}
.ln{display:inline-block;background:none;border:1px solid var(--bd);border-radius:999px;padding:10px 20px;cursor:pointer;text-decoration:none;color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:12px;padding:9px 16px;background:rgba(0,0,0,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.top img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--bd)}
.top b{font:700 19px 'Playfair Display',serif;color:var(--gold);flex:1}
.top a.l{color:var(--ink);text-decoration:none;display:none}
@media(min-width:700px){.top a.l{display:inline}}
#banner{background:linear-gradient(180deg,#f8d878,#c8921a);color:#1a1200;text-align:center;padding:8px 14px;font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.hero{display:grid;gap:26px;align-items:center;max-width:1080px;margin:0 auto;padding:30px 18px 10px}
@media(min-width:820px){.hero{grid-template-columns:1.05fr .95fr;padding:60px 22px 20px}}
.hero h1{font-size:clamp(40px,7.5vw,72px);line-height:1.02;font-weight:800}
.hero p{color:var(--mut);max-width:44ch;font-size:18px}
#hi{width:100%;aspect-ratio:1;object-fit:cover;border-radius:28px;border:1px solid var(--bd);box-shadow:0 0 90px rgba(240,194,75,.2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{border:1px solid var(--bd);border-radius:999px;padding:5px 13px;font-size:14px;background:var(--glass)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.sec{padding-top:34px}
.sec>h2{font-size:34px;margin-bottom:12px}
.nc{padding:16px 18px;margin-bottom:12px}.nc small{color:var(--mut);margin-left:8px}.nc p{margin:6px 0 0}
.tb{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:8;padding:10px 0 8px;background:linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,0))}
.pills{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px}
.pills button{white-space:nowrap;border:1px solid var(--bd);background:var(--glass);border-radius:999px;padding:6px 15px;cursor:pointer}
.pills button.a{background:var(--gold);color:#1a1200;border-color:var(--gold)}
input,select,textarea{width:100%;background:rgba(0,0,0,.6);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
input[type=checkbox],input[type=radio]{width:auto}
.ct{font-size:26px;margin:24px 0 2px}.n{color:var(--mut);font-size:14px;margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
@media(min-width:700px){.g{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
.cd{overflow:hidden;display:flex;flex-direction:column}
.cd.off{opacity:.5}
.im{aspect-ratio:4/3;background:radial-gradient(circle at 30% 20%,#3a2b08,#0b0803);display:grid;place-items:center;color:var(--gold2)}
.im img{width:100%;height:100%;object-fit:cover}
.cb{padding:12px;display:flex;flex-direction:column;flex:1}
.cb h4{font-size:17px;line-height:1.2}.cb small{color:var(--mut);min-height:1.3em}
.pr{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:8px}
.pr b{color:var(--gold);font-size:19px;font-weight:600}
.add{width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(180deg,#f8d878,#c8921a);color:#1a1200;font-size:24px;line-height:1;cursor:pointer}
.add:disabled{opacity:.35;cursor:not-allowed}
.vis{display:grid;gap:14px}@media(min-width:700px){.vis{grid-template-columns:1fr 1fr}}
.vis .glass{padding:18px}
footer{text-align:center;color:var(--mut);font-size:14px;padding:30px 16px 120px}
#badge{background:none;border:0;padding:10px;cursor:default;opacity:.5}
#fp{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:12;display:none;box-shadow:0 8px 30px rgba(0,0,0,.6);gap:18px;align-items:center}
#sc{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:24;display:none}#sc.on{display:block}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:25;transform:translateX(105%);transition:transform .25s;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto;background:#0a0803;border-left:1px solid var(--bd)}
#dr.on{transform:none}
#dr h2,#mb h2{font-size:26px;margin-bottom:8px}
@media(prefers-reduced-motion:reduce){#dr{transition:none}}
#m{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:30;display:none;align-items:flex-end;justify-content:center}#m.on{display:flex}
.box{background:#0a0803;border:1px solid var(--bd);border-radius:22px 22px 0 0;width:min(520px,100%);max-height:90%;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:15px}
.sd{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(240,194,75,.1);margin:0;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(240,194,75,.1)}
.row small{display:block;color:var(--mut)}
.q{display:flex;align-items:center;gap:8px}.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);background:none;cursor:pointer}
.tot{display:flex;justify-content:space-between;padding:2px 0}.tot.g2{color:var(--gold);font-size:20px;font-weight:600}
.err{color:var(--bad);min-height:1.2em;margin:6px 0}
#adm{position:fixed;inset:0;z-index:40;background:#050402;display:none;overflow:auto;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}#adm.on{display:block}
.ad{display:grid;gap:16px;max-width:1000px;margin:0 auto;padding:16px}
@media(min-width:800px){.ad{grid-template-columns:190px 1fr;gap:26px}}
.side{display:flex;gap:6px;flex-wrap:wrap;align-content:flex-start}
@media(min-width:800px){.side{flex-direction:column;flex-wrap:nowrap}}
.side button{border:1px solid var(--bd);background:none;border-radius:12px;padding:8px 14px;cursor:pointer;text-align:left}
.side button.a{background:var(--gold);color:#1a1200}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.st div{padding:12px;border:1px solid var(--bd);border-radius:14px;font-size:14px;color:var(--mut)}.st b{display:block;font-size:26px;color:var(--gold)}
.oc{border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.ar{display:grid;gap:6px;align-items:center}
.ph{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}.ph img{width:46px;height:46px;object-fit:cover;border-radius:8px}
.lb{padding:6px 16px}.lr{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(240,194,75,.1)}.lr:last-child{border:0}.lr small{display:block;color:var(--mut)}
.rk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--bd);font-weight:600}
.r0 .rk{background:linear-gradient(180deg,#f8d878,#c8921a);color:#1a1200}.r1 .rk{background:#d9d9d9;color:#111}.r2 .rk{background:#cd7f32;color:#111}.pt{color:var(--gold);font-weight:600}
#dr h4{margin:16px 0 4px;font-size:17px}#dr .pills{padding:4px 0}
</style></head>

<script>
const SRC='<!doctype html>'+document.documentElement.outerHTML;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+Number(n).toFixed(2);
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const CATS=['Daily Entrees','Beef Delicacy','Barbecue Ribs','Smothered Entrees','Fried Entrees','Weekly Specials','Desserts','Drinks'];
const NOTE={'Daily Entrees':'Served with 2 sides. Combo costs extra.','Beef Delicacy':'Served with 2 sides.','Barbecue Ribs':'Served with 2 sides. Combo costs extra.','Smothered Entrees':'Served with 2 sides.','Fried Entrees':'Fried to order, served with 2 sides. White meat costs extra.','Weekly Specials':'Served only on that day, with 2 sides.','Desserts':'Cakes, pies and cobblers cost extra.','Drinks':'Refills cost extra.'};
function dflt(){const I=[['Baked Chicken',11.99,2],['Pig Feet or Neck Bones',12.99,2],['Smoked Ham Hocks',15.99,2]].map(x=>[...x,'Daily Entrees']).concat([['Oxtails',25.99,2,'Beef Delicacy'],['Beef Tips and Rice',14.99,2,'Beef Delicacy'],['Beef Ribs',25.99,2,'Barbecue Ribs'],['Pork Ribs',19.99,2,'Barbecue Ribs'],['Smothered Turkey Necks',11.99,2,'Smothered Entrees'],['Smothered Pork Chop',11.99,2,'Smothered Entrees'],['Smothered Hamburger',11.99,2,'Smothered Entrees'],['Southern Fried Fish',13.99,2,'Fried Entrees'],['Fried Chicken',11.99,2,'Fried Entrees'],['Fried Pork Chop',11.99,2,'Fried Entrees'],['Smothered Livers and Onions',11.99,2,'Weekly Specials',1],['Sausage Red Beans with Rice',11.99,2,'Weekly Specials',2],['Chicken Tetrazzini',12.99,2,'Weekly Specials',3],['Turkey Wings',12.99,2,'Weekly Specials',4],['Meat Loaf',12.99,2,'Weekly Specials',5],['Vegetable Plate (3 items)',9.99,3,'Weekly Specials'],['Cakes and Pies',4.5,0,'Desserts'],['Blackberry Cobbler',4.5,0,'Desserts'],['Peach Cobbler',4.5,0,'Desserts'],['Banana Pudding',4.5,0,'Desserts'],['Strawberry Shortcake',4.5,0,'Desserts'],['Fresh Lemonade',2.5,0,'Drinks'],['Sweet Tea',2.5,0,'Drinks'],['Unsweet Tea',2.5,0,'Drinks']]);
const sd=[['Fresh Greens',1],['Peas',0],['Lima Beans',0],['Fried Corn',0],['Rice',0],['Macaroni and Cheese',1],['Sweet Potato',1],['String Beans and Potatoes',0],['Mashed Potato',0],['Fried Squash',1],['Fried Okra',0],['Okra and Tomatoes',0],['Potato Salad',1],['Rutabagas',1],['Fried Green Tomatoes',1]];
return{items:I.map((x,i)=>({id:'i'+i,name:x[0],price:x[1],sides:x[2],cat:x[3],day:x[4]===undefined?null:x[4],on:true})),sides:sd.map((x,i)=>({id:'s'+i,name:x[0],up:!!x[1],on:true})),set:{hash:'f985bb7b14f3394a277b6cdd9b18f8f195fa9484f3e27e5e9d8a4300ed4b6a4e',up:1.5,tax:7,fee:3.99,deliv:false},news:[],promos:[],board:[],site:{tagline:'Great authentic soul food, cooked the way Jackson loves it.',address:'3118 Livingston Road, Jackson, MS 39213',phone:'(601) 362-0484',hours:'',banner:'',hero:'',logo:''}}}
let S=null;try{S=JSON.parse(document.getElementById('seed').textContent)}catch(e){}
if(!S||!S.items)S=dflt();
S.news=S.news||[];S.promos=S.promos||[];S.board=S.board||[];S.set=Object.assign({fee:3.99,deliv:false},S.set);S.site=Object.assign(dflt().site,S.site);
let O=null;try{O=JSON.parse(localStorage.getItem('bullys-orders'))}catch(e){}
if(!O||!O.orders)O={orders:[],n:1};
const saveO=()=>{try{localStorage.setItem('bullys-orders',JSON.stringify(O))}catch(e){}};
let dirty=false;const dbar=()=>{const e=$('#dl');if(e)e.textContent=dirty?'Unpublished changes':''};
const save=()=>{dirty=true;dbar()};
const tel=()=>'+1'+S.site.phone.replace(/\D/g,'');
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
let C=[],cat='All',q='';try{C=JSON.parse(localStorage.getItem('bullys-cart'))}catch(e){}if(!Array.isArray(C))C=[];
const lineP=l=>(l.price+l.sides.filter(s=>s.up).length*S.set.up)*l.qty;
const sub=()=>C.reduce((a,l)=>a+lineP(l),0);
function menu(){const T=S.site;
$('#banner').innerHTML=T.banner?esc(T.banner):'';$('#banner').style.display=T.banner?'block':'none';
if(T.logo)$('#lg').src=T.logo;if(T.hero)$('#hi').src=T.hero;
$('#tg').textContent=T.tagline;$('#ad').textContent=T.address;$('#ph').textContent=T.phone;
document.querySelectorAll('.tl').forEach(a=>a.href='tel:'+tel());
$('#mp').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(T.address);
$('#hrs').innerHTML=T.hours?esc(T.hours).replace(/\n/g,'<br>'):'Call us for today\'s hours.';
const nw=S.news.filter(n=>n.on);$('#nl').hidden=!nw.length;
$('#news').innerHTML=nw.length?`<section class="sec" id="news-s"><h2>News</h2>${nw.map(n=>`<article class="glass nc"><h4>${esc(n.title)}</h4><small>${esc(n.date)}</small><p>${esc(n.body).replace(/\n/g,'<br>')}</p></article>`).join('')}</section>`:'';
const lb=[...S.board].sort((a,b)=>b.pts-a.pts).slice(0,10);$('#ll').hidden=!lb.length;
$('#lb').innerHTML=lb.length?`<section class="sec" id="lb-s"><h2>Leaderboard</h2><p class="n">Our regulars. Order, show up, climb the board.</p><div class="glass lb">${lb.map((r,i)=>`<div class="lr r${i}"><span class="rk">${i+1}</span><div><b>${esc(r.name)}</b><small>${esc(r.note||'')}</small></div><span class="pt">${r.pts} pts</span></div>`).join('')}</div></section>`:'';
$('#pills').innerHTML=['All',...CATS].map(c=>`<button class="${c==cat?'a':''}" onclick="cat='${c}';menu()">${c}</button>`).join('');
grid();bar()}
function grid(){const d=new Date().getDay();
const ico='<svg viewBox="0 0 24 24" width="40" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 18h18M5 18a7 7 0 0114 0M12 9V7m-2 0h4"/></svg>';
$('#grid').innerHTML=CATS.map(c=>{if(cat!='All'&&cat!=c)return'';const its=S.items.filter(x=>x.cat==c&&(!q||x.name.toLowerCase().includes(q)));if(!its.length)return'';
return `<h3 class="ct">${c}</h3><p class="n">${NOTE[c]||''}</p><div class="g">${its.map(x=>{const ok=x.on&&(x.day==null||x.day==d);
return `<article class="glass cd ${ok?'':'off'}"><div class="im">${x.img?`<img src="${x.img}" alt="${esc(x.name)}" loading="lazy">`:ico}</div><div class="cb"><h4>${esc(x.name)}</h4><small>${!x.on?'Sold out today':x.day!=null&&x.day!=d?DAYS[x.day]+' only':x.sides?'With '+x.sides+' sides':''}</small><div class="pr"><b>${money(x.price)}</b><button class="add" ${ok?'':'disabled'} onclick="pick('${x.id}')" aria-label="Add ${esc(x.name)}">+</button></div></div></article>`}).join('')}</div>`}).join('')||'<p class="n">No dishes match. Try another word.</p>'}
function bar(){try{localStorage.setItem('bullys-cart',JSON.stringify(C))}catch(e){}const n=C.reduce((a,l)=>a+l.qty,0);$('#fp').style.display=n?'flex':'none';$('#bc').textContent='View order ('+n+')';$('#bt').textContent=money(sub()*(1+S.set.tax/100));$('#hc').textContent=n?'Order ('+n+')':'Order'}
function show(h){$('#mb').innerHTML=h;$('#m').classList.add('on')}
function hide(){$('#m').classList.remove('on')}
function pick(id){const it=S.items.find(x=>x.id==id);if(!it.sides){add(it,[]);return}
const av=S.sides.filter(s=>s.on);
show(`<h2>${esc(it.name)}</h2><p class="n">Choose ${it.sides} sides. Marked sides add ${money(S.set.up)} each.</p>${av.map(s=>`<label class="sd"><input type="checkbox" value="${s.id}" onchange="chk(${it.sides})"> ${esc(s.name)}${s.up?' (+'+money(S.set.up)+')':''}</label>`).join('')||'<p class="err">No sides are available today. Please call us.</p>'}<p style="margin-top:14px"><button class="btn" id="sg" disabled onclick="addS('${id}')">Add to order</button> <button class="ln" onclick="hide()">Cancel</button></p>`)}
function chk(n){const c=[...document.querySelectorAll('#mb input:checked')];const full=c.length>=n;document.querySelectorAll('#mb input:not(:checked)').forEach(i=>i.disabled=full);$('#sg').disabled=c.length!=n}
function addS(id){const it=S.items.find(x=>x.id==id);add(it,[...document.querySelectorAll('#mb input:checked')].map(i=>S.sides.find(s=>s.id==i.value)));hide()}
function add(it,ss){const key=it.id+ss.map(s=>s.id).sort().join();const l=C.find(x=>x.key==key);if(l)l.qty++;else C.push({key,name:it.name,price:it.price,sides:ss.map(s=>({name:s.name,up:s.up})),qty:1});bar()}
function qty(i,d){C[i].qty+=d;if(C[i].qty<1)C.splice(i,1);bar();cart()}
function openCart(){cart();$('#dr').classList.add('on');$('#sc').classList.add('on')}
function closeCart(){$('#dr').classList.remove('on');$('#sc').classList.remove('on')}
let CK={type:'Pickup',tip:0,promo:null,pm:'',when:'ASAP',pay:'Cash',name:'',phone:'',addr:'',note:''};
try{Object.assign(CK,JSON.parse(localStorage.getItem('bullys-me'))||{})}catch(e){}
const meSave=()=>{try{localStorage.setItem('bullys-me',JSON.stringify({name:CK.name,phone:CK.phone,addr:CK.addr}))}catch(e){}};
function totals(){const s=sub(),dis=CK.promo?s*CK.promo.pct/100:0,bs=s-dis,fee=CK.type=='Delivery'?S.set.fee:0,tx=bs*S.set.tax/100,tip=bs*CK.tip/100;return{s,dis,fee,tx,tip,t:bs+fee+tx+tip}}
function slots(){const o=['ASAP'];let d=new Date(Date.now()+30*60000);d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0);for(let i=0;i<12;i++){o.push(d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}));d=new Date(d.getTime()+15*60000)}return o}
function ck(k,v){CK[k]=v;cart()}
function fv(k,v){CK[k]=v;meSave()}
function applyPromo(){const c=($('#pc').value||'').trim().toUpperCase(),p=S.promos.find(x=>x.on&&x.code.toUpperCase()==c);if(p){CK.promo={code:p.code,pct:p.pct};CK.pm=''}else{CK.promo=null;CK.pm=c?'That code is not valid.':''}cart()}
function addId(id){add(S.items.find(x=>x.id==id),[]);cart()}
const seg=(k,o)=>`<div class="pills">${o.map(([v,l])=>`<button class="${CK[k]==v?'a':''}" onclick="ck('${k}',${typeof v=='number'?v:"'"+v+"'"})">${l}</button>`).join('')}</div>`;
function cart(){
if(!C.length){$('#dr').innerHTML='<h2>Your order</h2><p class="n">Nothing here yet. Pick a dish from the menu and tap +.</p><button class="ln" onclick="closeCart()">Back to menu</button>';return}
if(CK.type=='Delivery'&&!S.set.deliv)CK.type='Pickup';
const T=totals(),types=[['Pickup','Pickup'],['Dine in','Dine in']].concat(S.set.deliv?[['Delivery','Delivery']]:[]);
const up=S.items.filter(x=>(x.cat=='Drinks'||x.cat=='Desserts')&&x.on&&!C.some(l=>l.key==x.id)).slice(0,4);
$('#dr').innerHTML=`<h2>Your order</h2>${C.map((l,i)=>`<div class="row"><div><b>${esc(l.name)}</b><small>${l.sides.map(x=>esc(x.name)).join(', ')}</small></div><div class="q"><button onclick="qty(${i},-1)" aria-label="Remove one">-</button>${l.qty}<button onclick="qty(${i},1)" aria-label="Add one">+</button></div><span>${money(lineP(l))}</span></div>`).join('')}
${up.length?`<h4>Add a drink or dessert</h4><div class="pills">${up.map(x=>`<button onclick="addId('${x.id}')">+ ${esc(x.name)} ${money(x.price)}</button>`).join('')}</div>`:''}
<h4>Order type</h4>${seg('type',types)}
${CK.type=='Delivery'?`<label for="ca">Delivery address</label><input id="ca" value="${esc(CK.addr)}" oninput="fv('addr',this.value)" autocomplete="street-address">`:''}
<label for="cw">${CK.type=='Delivery'?'Deliver':'Ready'} at</label><select id="cw" onchange="CK.when=this.value">${slots().map(s=>`<option ${s==CK.when?'selected':''}>${s}</option>`).join('')}</select>
<h4>Tip</h4>${seg('tip',[[0,'None'],[10,'10%'],[15,'15%'],[20,'20%']])}
<h4>Promo code</h4><div class="ar" style="grid-template-columns:1fr auto"><input id="pc" value="${CK.promo?esc(CK.promo.code):''}" placeholder="Enter code"><button class="ln" onclick="applyPromo()">Apply</button></div><p class="${CK.promo?'n':'err'}">${CK.promo?CK.promo.pct+'% off applied':esc(CK.pm)}</p>
<h4>Your details</h4><label for="cn">Name</label><input id="cn" value="${esc(CK.name)}" oninput="fv('name',this.value)" autocomplete="name"><label for="cp">Phone</label><input id="cp" type="tel" value="${esc(CK.phone)}" oninput="fv('phone',this.value)" autocomplete="tel">
<label for="cm">Notes (optional)</label><textarea id="cm" rows="2" oninput="CK.note=this.value" placeholder="Extra gravy, bread, white meat...">${esc(CK.note)}</textarea>
<h4>Pay with</h4>${seg('pay',[['Cash','Cash'],['Card','Card']])}<p class="n">${CK.type=='Delivery'?'You pay the driver on delivery.':'You pay at the restaurant.'}</p>
<div style="margin-top:14px"><div class="tot"><span>Subtotal</span><span>${money(T.s)}</span></div>${T.dis?`<div class="tot"><span>Promo ${esc(CK.promo.code)}</span><span>-${money(T.dis)}</span></div>`:''}${T.fee?`<div class="tot"><span>Delivery fee</span><span>${money(T.fee)}</span></div>`:''}<div class="tot"><span>Tax (${S.set.tax}%)</span><span>${money(T.tx)}</span></div>${T.tip?`<div class="tot"><span>Tip</span><span>${money(T.tip)}</span></div>`:''}<div class="tot g2"><span>Total</span><span>${money(T.t)}</span></div></div>
<p class="err" id="ce"></p><button class="btn" onclick="place()">Place order</button> <button class="ln" onclick="closeCart()">Keep browsing</button>`}
function place(){const n=CK.name.trim(),p=CK.phone.trim();
if(!n||p.replace(/\D/g,'').length<7){$('#ce').textContent='Enter your name and a phone number we can call.';return}
if(CK.type=='Delivery'&&CK.addr.trim().length<6){$('#ce').textContent='Enter your delivery address.';return}
const T=totals(),when=$('#cw').value,o={id:'B'+String(O.n++).padStart(3,'0'),day:new Date().toDateString(),time:new Date().toLocaleString(),name:n,phone:p,type:CK.type,when,addr:CK.type=='Delivery'?CK.addr.trim():'',pay:CK.pay,tip:T.tip,promo:CK.promo?CK.promo.code:'',note:CK.note.trim(),lines:C,total:T.t,status:'New'};
O.orders.unshift(o);saveO();
const txt=`Order ${o.id} - ${o.type}, ${when}\n${n} ${p}${o.addr?'\n'+o.addr:''}\n`+C.map(l=>`${l.qty}x ${l.name}${l.sides.length?' ('+l.sides.map(x=>x.name).join(', ')+')':''}`).join('\n')+`\nTotal ${money(T.t)}${T.tip?' (tip '+money(T.tip)+')':''}, pay ${o.pay}`+(o.promo?`\nPromo ${o.promo}`:'')+(o.note?`\nNote: ${o.note}`:'');
C=[];CK.promo=null;CK.pm='';CK.note='';bar();
$('#dr').innerHTML=`<h2>Order ${o.id} placed</h2><p>Thank you, ${esc(n)}. ${o.type=='Delivery'?'Delivery':'Ready'}: ${esc(when)}.</p><p>Send your order by text so the kitchen sees it right away.</p><p><a class="btn" href="sms:${tel()}?&body=${encodeURIComponent(txt)}">Text order to Bully's</a></p><div class="tot g2"><span>Total</span><span>${money(T.t)}</span></div><p class="n">${o.type=='Delivery'?'You pay the driver on delivery.':'You pay at the restaurant.'} Questions? Call ${esc(S.site.phone)}.</p><button class="ln" onclick="closeCart()">Close</button>`}
/* secret badge */
let tp=0,tt;$('#badge').onclick=()=>{tp++;clearTimeout(tt);tt=setTimeout(()=>tp=0,2500);if(tp>=5){tp=0;login()}};
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function login(){show(`<h2>Staff only</h2><label for="ap">Passcode</label><input id="ap" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')go()"><p class="err" id="ae"></p><button class="btn" onclick="go()">Open admin</button> <button class="ln" onclick="hide()">Cancel</button>`);setTimeout(()=>$('#ap').focus(),50)}
async function go(){let ok=false;try{ok=(await sha($('#ap').value))===S.set.hash}catch(e){$('#ae').textContent='Admin needs a secure (https) page.';return}
if(ok){hide();at='orders';adm();$('#adm').classList.add('on')}else $('#ae').textContent='Wrong passcode.'}
function chp(el){if(el.value.length<4){el.value='';el.placeholder='Use 4+ characters';return}sha(el.value).then(h=>{S.set.hash=h;save();el.value='';el.placeholder='Passcode changed'})}
let ART=null;try{window.claude&&window.claude.use('artifact').then(a=>ART=a).catch(()=>{})}catch(e){}
async function pub(){const m=$('#pm');
if(!ART){m.textContent='Publishing only works when you open this page from your own Claude account.';return}
m.textContent='Publishing...';
try{const j=JSON.stringify(S).replace(/</g,'\\u003c');
const html=SRC.replace(/(<script id="seed" type="application\/json">)[\s\S]*?(<\/script>)/,(x,p,r)=>p+j+r);
await ART.publish(html);dirty=false;m.textContent='Published. The page will reload.'}catch(e){m.textContent='Could not publish: '+(e.code||e.message||e)}}
function upload(inp,max,cb){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(f)}
let at='orders',of='All';
const fld=(k,l,ta)=>`<label>${l}</label>${ta?`<textarea rows="4" onchange="S.site.${k}=this.value;save();menu()">${esc(S.site[k])}</textarea>`:`<input value="${esc(S.site[k])}" onchange="S.site.${k}=this.value;save();menu()">`}`;
const pic=(k,l,max)=>`<label>${l}</label><div class="ph">${S.site[k]?`<img src="${S.site[k]}" alt="">`:'<small class="n">Using the default</small>'}<label class="ln" style="margin:0;cursor:pointer">Upload<input type="file" accept="image/*" hidden onchange="upload(this,${max},d=>{S.site.${k}=d;save();menu();adm()})"></label>${S.site[k]?`<button class="ln" onclick="S.site.${k}='';save();menu();adm()">Use default</button>`:''}</div>`;
function adm(){const tabs=['orders','news','menu','sides','board','promos','site','settings'];
$('#as').innerHTML=`<h2 style="font-size:24px;width:100%">Admin</h2>`+tabs.map(t=>`<button class="${t==at?'a':''}" onclick="at='${t}';adm()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')+`<button onclick="$('#adm').classList.remove('on')">Close admin</button>`;
let b=`<p><button class="btn" onclick="pub()">Publish changes</button> <span id="dl" class="n">${dirty?'Unpublished changes':''}</span></p><p class="n" id="pm">Edits reach customers only after you publish.</p>`;
if(at=='orders'){const td=O.orders.filter(o=>o.day==new Date().toDateString());
b+=`<div class="st"><div><b>${td.length}</b>Orders today</div><div><b>${money(td.reduce((a,o)=>a+o.total,0))}</b>Sales today</div><div><b>${O.orders.filter(o=>o.status!='Done').length}</b>Open orders</div></div><div class="pills">${['All','New','Preparing','Ready','Done'].map(s=>`<button class="${s==of?'a':''}" onclick="of='${s}';adm()">${s}</button>`).join('')}</div>`;
const L=O.orders.map((o,i)=>[o,i]).filter(x=>of=='All'||x[0].status==of);
b+=L.length?L.map(([o,i])=>`<div class="oc"><b>${o.id}</b> — ${esc(o.name)}, <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br><small class="n">${esc(o.time)} — ${o.type} — ${money(o.total)}${o.when?' — '+esc(o.when):''}${o.addr?' — '+esc(o.addr):''}${o.tip?' — tip '+money(o.tip):''}${o.promo?' — '+esc(o.promo):''}${o.pay?' — '+o.pay:''}</small>${o.lines.map(l=>`<div>${l.qty}x ${esc(l.name)} <small class="n">${l.sides.map(x=>esc(x.name)).join(', ')}</small></div>`).join('')}${o.note?`<div><i>${esc(o.note)}</i></div>`:''}<p><select onchange="O.orders[${i}].status=this.value;saveO();adm()" style="width:auto">${['New','Preparing','Ready','Done'].map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select> <button class="ln" onclick="O.orders.splice(${i},1);saveO();adm()">Delete</button></p></div>`).join(''):'<p class="n">No orders here. Orders placed on this device show up here.</p>'}
if(at=='news')b+=S.news.map((n,i)=>`<div class="oc"><input value="${esc(n.title)}" onchange="S.news[${i}].title=this.value;save();menu()" aria-label="Title"><input value="${esc(n.date)}" onchange="S.news[${i}].date=this.value;save();menu()" style="margin-top:6px" aria-label="Date"><textarea rows="3" style="margin-top:6px" onchange="S.news[${i}].body=this.value;save();menu()" aria-label="Text">${esc(n.body)}</textarea><p><label style="display:inline"><input type="checkbox" ${n.on?'checked':''} onchange="S.news[${i}].on=this.checked;save();menu()"> Show on site</label> <button class="ln" onclick="S.news.splice(${i},1);save();menu();adm()">Delete</button></p></div>`).join('')+`<button class="btn" onclick="S.news.unshift({title:'New post',date:new Date().toLocaleDateString(),body:'',on:true});save();menu();adm()">Add news post</button>`;
if(at=='menu')b+=`<p class="n">Name, price, available today, and a photo for each dish.</p>`+S.items.map((x,i)=>`<div class="oc"><div class="ar" style="grid-template-columns:1fr 86px auto auto"><input value="${esc(x.name)}" onchange="S.items[${i}].name=this.value;save();menu()" aria-label="Name"><input type="number" step="0.01" value="${x.price}" onchange="S.items[${i}].price=+this.value;save();menu()" aria-label="Price"><input type="checkbox" ${x.on?'checked':''} onchange="S.items[${i}].on=this.checked;save();menu()" aria-label="Available"><button class="ln" onclick="S.items.splice(${i},1);save();menu();adm()" aria-label="Delete dish">x</button></div><div class="ph">${x.img?`<img src="${x.img}" alt="">`:''}<label class="ln" style="cursor:pointer;margin:0">${x.img?'Change photo':'Add photo'}<input type="file" accept="image/*" hidden onchange="upload(this,560,d=>{S.items[${i}].img=d;save();menu();adm()})"></label>${x.img?`<button class="ln" onclick="S.items[${i}].img='';save();menu();adm()">Remove photo</button>`:''}</div></div>`).join('')+`<h3 style="margin-top:18px">Add dish</h3><input id="nn" placeholder="Name"><div class="ar" style="grid-template-columns:1fr 1fr 1fr;margin:6px 0"><input id="np" type="number" step="0.01" placeholder="Price"><select id="nc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><select id="ns"><option value="2">2 sides</option><option value="0">No sides</option><option value="3">3 sides</option></select></div><button class="btn" onclick="addI()">Add dish</button>`;
if(at=='sides')b+=`<p class="n">Tick the sides available today, and mark upcharge sides.</p>`+S.sides.map((x,i)=>`<div class="ar sd" style="grid-template-columns:auto 1fr auto auto"><input type="checkbox" ${x.on?'checked':''} onchange="S.sides[${i}].on=this.checked;save()" aria-label="Available"><span>${esc(x.name)}</span><label style="margin:0"><input type="checkbox" ${x.up?'checked':''} onchange="S.sides[${i}].up=this.checked;save()"> upcharge</label><button class="ln" onclick="S.sides.splice(${i},1);save();adm()">x</button></div>`).join('')+`<div class="ar" style="grid-template-columns:1fr auto;margin-top:10px"><input id="sn" placeholder="New side name"><button class="btn" onclick="if($('#sn').value.trim()){S.sides.push({id:uid(),name:$('#sn').value.trim(),up:false,on:true});save();adm()}">Add side</button></div>`;
if(at=='board')b+=`<p class="n">People on the public leaderboard, sorted by points. The top 10 show.</p>`+S.board.map((r,i)=>`<div class="oc"><div class="ar" style="grid-template-columns:1fr 90px auto"><input value="${esc(r.name)}" onchange="S.board[${i}].name=this.value;save();menu()" aria-label="Name"><input type="number" value="${r.pts}" onchange="S.board[${i}].pts=+this.value;save();menu()" aria-label="Points"><button class="ln" onclick="S.board.splice(${i},1);save();menu();adm()" aria-label="Remove">x</button></div><input style="margin-top:6px" value="${esc(r.note||'')}" placeholder="Note, for example: 12 orders this month" onchange="S.board[${i}].note=this.value;save();menu()"></div>`).join('')+`<button class="btn" onclick="S.board.push({name:'New regular',pts:0,note:''});save();menu();adm()">Add person</button>`;
if(at=='promos')b+=`<p class="n">Customers type a code in the cart. Each takes a percent off the food subtotal. Tick to turn a code on.</p>`+S.promos.map((p,i)=>`<div class="oc"><div class="ar" style="grid-template-columns:1fr 80px auto auto"><input value="${esc(p.code)}" onchange="S.promos[${i}].code=this.value.trim();save()" aria-label="Code"><input type="number" value="${p.pct}" onchange="S.promos[${i}].pct=+this.value;save()" aria-label="Percent off"><input type="checkbox" ${p.on?'checked':''} onchange="S.promos[${i}].on=this.checked;save()" aria-label="Active"><button class="ln" onclick="S.promos.splice(${i},1);save();adm()" aria-label="Remove">x</button></div></div>`).join('')+`<button class="btn" onclick="S.promos.push({code:'WELCOME10',pct:10,on:true});save();adm()">Add promo code</button>`;
if(at=='site')b+=pic('hero','Main photo (home page)',1000)+pic('logo','Logo (round, top left)',300)+fld('banner','Banner message (top of page, leave empty to hide)')+fld('tagline','Tagline')+fld('address','Address')+fld('phone','Phone')+fld('hours','Hours (one line per day)',1);
if(at=='settings')b+=`<label>Upcharge per marked side ($)</label><input type="number" step="0.01" value="${S.set.up}" onchange="S.set.up=+this.value;save()"><label>Tax rate (%)</label><input type="number" step="0.01" value="${S.set.tax}" onchange="S.set.tax=+this.value;save()"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${S.set.deliv?'checked':''} onchange="S.set.deliv=this.checked;save()"> Offer delivery</label><label>Delivery fee ($)</label><input type="number" step="0.01" value="${S.set.fee}" onchange="S.set.fee=+this.value;save()"><label>New admin passcode</label><input type="password" placeholder="New passcode" onchange="chp(this)"><p><button class="ln" onclick="if(confirm('Reset dishes and sides to the default list?')){const d=dflt();S.items=d.items;S.sides=d.sides;save();menu();adm()}">Reset menu to default</button></p>`;
$('#ab').innerHTML=b}
function addI(){const n=$('#nn').value.trim(),p=+$('#np').value;if(!n||!p)return;S.items.push({id:uid(),name:n,price:p,sides:+$('#ns').value,cat:$('#nc').value,day:null,on:true});save();menu();adm()}
menu();
</script></body></html>
